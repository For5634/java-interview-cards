<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>八股卡片复习</title>
    <link rel="stylesheet" href="styles.css?v=3">
  </head>
  <body class="simple-card-page">
    <aside class="simple-local-warning hidden" id="localStorageNotice" aria-live="polite">
      <strong>本地文件模式</strong>
      <span>浏览器可能阻止本地文件加载卡片数据。</span>
      <a href="https://for5634.github.io/java-interview-cards/">打开在线版</a>
      <button class="simple-warning-close" id="dismissStorageNotice" type="button" aria-label="关闭提示">×</button>
    </aside>
    <div class="shell simple-card-shell">
      <header class="topbar simple-topbar">
        <div>
          <p class="eyebrow">JAVA · 面试复习</p>
          <h1>八股卡片复习</h1>
        </div>
        <div class="top-actions">
          <button class="primary-button" id="flipButton" type="button">查看答案</button>
        </div>
      </header>

      <main class="simple-workspace">
        <aside class="panel simple-filter-panel" aria-label="卡片筛选">
          <label class="field-label" for="searchInput">搜索卡片</label>
          <input id="searchInput" type="search" placeholder="题面、答案或分类">
          <details class="simple-filter-details" id="filterDetails" open>
            <summary>分类与卡片列表</summary>
            <div class="simple-filter-content">
              <div class="filter-block">
                <div class="section-title">卡片分类</div>
                <button class="tag-button starred-filter" id="starredFilterButton" type="button" aria-pressed="false">★ 重点集 (0)</button>
                <div class="tag-grid" id="categoryFilters"></div>
              </div>
              <p class="simple-count" id="cardCount">0 张卡片</p>
              <div class="simple-card-list" id="cardList" aria-label="卡片列表"></div>
            </div>
          </details>
        </aside>

        <section class="simple-study-zone" aria-label="复习卡片">
          <article class="flashcard simple-flashcard" id="flashcard" tabindex="0" aria-live="polite">
            <div class="card-side card-front simple-card-face">
              <div class="simple-card-meta"><span id="cardCategory">未分类</span><span id="cardProficiency">生疏</span><button class="star-toggle" id="starToggleButton" type="button" aria-label="加入重点集" aria-pressed="false"><span aria-hidden="true">☆</span></button></div>
              <p class="simple-side-label">题面</p>
              <h2 id="cardQuestion">加载卡片中……</h2>
              <p class="simple-flip-tip" id="cardFlipTip">点击卡片查看精简答案。</p>
            </div>
            <div class="card-side card-back simple-card-face">
              <div class="simple-card-meta"><span id="cardCategoryBack">未分类</span><span id="cardProficiencyBack">生疏</span><button class="star-toggle" id="starToggleButtonBack" type="button" aria-label="加入重点集" aria-pressed="false"><span aria-hidden="true">☆</span></button></div>
              <p class="simple-side-label" id="cardAnswerLabel">精简答案</p>
              <div class="simple-answer" id="cardAnswer">答案会显示在这里。</div>
              <button class="simple-detail-trigger hidden" id="showDetailedButton" type="button">查看详细答案</button>
            </div>
          </article>
          <div class="review-actions simple-review-actions" aria-label="更新记忆熟练度">
            <button id="weakButton" type="button">生疏</button>
            <button id="normalButton" type="button">一般</button>
            <button id="masteredButton" type="button">熟练</button>
          </div>
          <p class="simple-review-note">点卡片翻面；标记熟练度后自动进入下一张。</p>
        </section>

        <aside class="panel simple-stats-panel" aria-label="学习进度">
          <details class="simple-stats-details" id="statsDetails" open>
            <summary>学习进度</summary>
            <div class="simple-stats-content">
              <div class="stats-section">
                <div class="stats-grid">
                  <div class="stat-item"><strong id="totalCount">0</strong><span>总计</span></div>
                  <div class="stat-item stat-weak"><strong id="weakCount">0</strong><span>生疏</span></div>
                  <div class="stat-item stat-normal"><strong id="normalCount">0</strong><span>一般</span></div>
                  <div class="stat-item stat-mastered"><strong id="masteredCount">0</strong><span>熟练</span></div>
                </div>
                <p class="study-tip" id="studyTip">开始复习吧！</p>
              </div>

              <div class="stats-section">
                <div class="section-title">快捷键</div>
                <div class="shortcut-list">
                  <div class="shortcut-item"><kbd>F</kbd><span>翻面</span></div>
                  <div class="shortcut-item"><kbd>1</kbd><span>标记为生疏</span></div>
                  <div class="shortcut-item"><kbd>2</kbd><span>标记为一般</span></div>
                  <div class="shortcut-item"><kbd>3</kbd><span>标记为熟练</span></div>
                  <div class="shortcut-item"><kbd>←</kbd><kbd>→</kbd><span>切换卡片</span></div>
                </div>
              </div>

              <div class="stats-section progress-backup-section">
                <div class="section-title">进度备份</div>
                <p class="note">备份包含熟练度和重点标记；导入会更新匹配卡片的进度，不覆盖答案内容。</p>
                <div class="progress-backup-actions">
                  <button class="ghost-button" id="exportProgressButton" type="button">导出备份</button>
                  <button class="ghost-button" id="importProgressButton" type="button">导入备份</button>
                  <input class="hidden" id="progressFileInput" type="file" accept="application/json,.json" aria-label="选择进度备份文件">
                </div>
              </div>
            </div>
          </details>
        </aside>
      </main>
    </div>
    <div class="simple-toast" id="toast" role="status" aria-live="polite"></div>
    <script src="review.js?v=3"></script>
  </body>
</html>
