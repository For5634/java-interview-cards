<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff1e7">
  <title>八股卡片 · 面试复习</title>
  <link rel="stylesheet" href="styles.css?v=1b6e3494d694">
</head>
<body class="review-page">
  <aside class="local-notice hidden" id="localStorageNotice" aria-live="polite"><span>本地文件可能无法加载卡片数据。<a href="https://for5634.github.io/java-interview-cards/">打开在线版</a></span><button id="dismissStorageNotice" type="button" aria-label="关闭提示">×</button></aside>
  <div class="review-shell">
    <header class="page-header">
      <div class="brand"><span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="5" y="5" width="19" height="23" rx="3" transform="rotate(-9 5 5)"/><rect x="10" y="3" width="19" height="23" rx="3"/><path d="M15 10h9M15 15h6"/></svg></span><h1>八股卡片</h1></div>
      <span class="header-note"><span class="status-dot" aria-hidden="true"></span>进度自动保存在此浏览器</span>
    </header>
    <main class="review-workspace" id="reviewWorkspace">
      <aside class="library-panel" id="libraryPanel" aria-label="卡片目录">
        <div class="library-title"><h2>题库</h2><button id="closeSidebarButton" type="button" aria-label="关闭题库">×</button></div>
        <label class="search-field" for="searchInput"><svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="searchInput" type="search" placeholder="搜索题目或答案" autocomplete="off"><span class="sr-only">搜索卡片</span></label>
        <div class="collection-switch" aria-label="选择卡片集"><button class="collection-button active" id="allCardsButton" type="button" aria-pressed="true">全部卡片</button><button class="collection-button" id="starredFilterButton" type="button" aria-pressed="false">★ 重点集 (0)</button></div>
        <details class="library-details" id="filterDetails" open>
          <summary>分类与题目目录</summary>
          <div class="library-content"><div class="library-heading">知识分类</div><div class="category-grid" id="categoryFilters"></div><div class="list-heading"><span id="cardCount">加载卡片中</span><span>生疏优先</span></div><div class="card-list" id="cardList" aria-label="卡片列表"></div></div>
        </details>
      </aside>
      <div class="main-column">
      <section class="study-zone" aria-label="复习卡片">
        <div class="study-toolbar"><div class="toolbar-heading"><button class="sidebar-toggle" id="sidebarToggleButton" type="button" aria-controls="libraryPanel" aria-expanded="true" aria-label="收起题库"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg><span id="sidebarToggleLabel">题库</span></button><h2 id="collectionTitle">全部卡片</h2></div><div class="navigation-actions"><span id="cardPosition">准备开始复习</span><button id="previousCardButton" type="button" aria-label="上一张卡片"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button id="nextCardButton" type="button" aria-label="下一张卡片"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></div>
        <div class="study-card">
        <article class="flashcard" id="flashcard" tabindex="0" aria-label="点击卡片翻面" aria-live="polite">
          <div class="card-front card-face">
            <div class="card-meta"><div class="card-badges"><span id="cardCategory">未分类</span><span class="proficiency-badge" id="cardProficiency">生疏</span></div><button class="star-toggle" id="starToggleButton" type="button" aria-label="加入重点集" aria-pressed="false"><span aria-hidden="true">☆</span></button></div>
            <div class="question-body"><h2 class="question" id="cardQuestion">加载卡片中……</h2></div><p class="flip-tip" id="cardFlipTip">点击卡片或下方按钮查看答案</p>
          </div>
          <div class="card-back card-face">
            <div class="card-meta"><div class="card-badges"><span id="cardCategoryBack">未分类</span><span class="proficiency-badge" id="cardProficiencyBack">生疏</span></div><button class="star-toggle" id="starToggleButtonBack" type="button" aria-label="加入重点集" aria-pressed="false"><span aria-hidden="true">☆</span></button></div>
            <h2 class="answer-question" id="cardQuestionBack"></h2><section class="answer-section" aria-label="卡片答案"><div class="answer-heading"><p class="side-label" id="cardAnswerLabel">精简答案</p><button class="detail-trigger hidden" id="showDetailedButton" type="button">展开详细答案</button></div><div class="answer-content" id="cardAnswer">答案会显示在这里。</div></section>
          </div>
        </article>
        <div class="review-controls"><button class="flip-button" id="flipButton" type="button">查看答案</button><div class="rating-actions" role="group" aria-label="更新记忆熟练度"><button class="rating-weak" id="weakButton" type="button" aria-pressed="false"><span>生疏</span><kbd aria-hidden="true">1</kbd></button><button class="rating-normal" id="normalButton" type="button" aria-pressed="false"><span>一般</span><kbd aria-hidden="true">2</kbd></button><button class="rating-mastered" id="masteredButton" type="button" aria-pressed="false"><span>熟练</span><kbd aria-hidden="true">3</kbd></button></div><span class="review-note">标记后自动进入下一题</span></div>
        </div>
      </section>
      <aside class="progress-panel" aria-label="学习进度与备份">
        <div class="progress-overview"><div class="progress-heading"><h2 class="sr-only">这组卡片的学习进度</h2><span class="progress-title">已熟练 <strong id="masteryPercentage">0%</strong></span><div class="mastery-meter" id="masteryMeter" role="progressbar" aria-label="当前卡片集的熟练掌握比例" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="masteryFill"></span></div><p id="studyTip" class="sr-only" aria-live="polite">开始复习吧</p></div>
        <div class="stats-grid"><div><strong id="totalCount">0</strong><span>总题数</span></div><div class="stat-weak"><strong id="weakCount">0</strong><span>生疏</span></div><div class="stat-normal"><strong id="normalCount">0</strong><span>一般</span></div><div class="stat-mastered"><strong id="masteredCount">0</strong><span>熟练</span></div></div></div>
        <details class="utility-details" id="statsDetails"><summary>备份与快捷键</summary><div class="utility-content"><div class="backup-tools"><p>换设备时，导出并导入备份即可恢复熟练度与星标。</p><div class="backup-actions"><button id="exportProgressButton" type="button">导出备份</button><button id="importProgressButton" type="button">导入备份</button><input class="hidden" id="progressFileInput" type="file" accept="application/json,.json" aria-label="选择进度备份文件"></div></div><p class="keyboard-help"><span><kbd>F</kbd> 翻面</span><span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> 标记熟练度</span><span><kbd>←</kbd> <kbd>→</kbd> 切换卡片</span></p></div></details>
      </aside>
      </div>
    </main>
  </div>
  <button class="sidebar-backdrop hidden" id="sidebarBackdrop" type="button" aria-label="关闭题库"></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="review.js?v=1b6e3494d694"></script>
</body>
</html>
